services:
  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    ports:
      - "${RADMON_GRAFANA_PORT:-3300}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      RADMON_GRAFANA_DB_HOST: ${RADMON_GRAFANA_DB_HOST:-host.docker.internal}
      RADMON_DB_PORT: ${RADMON_DB_PORT:-3306}
      RADMON_DB_USER: ${RADMON_DB_USER:-root}
      RADMON_DB_PASSWORD: ${RADMON_DB_PASSWORD:-}
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 2s
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data: {}
