name: Cleanup release branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_cleanup-release-branch.yml

permissions:
  contents: write

jobs:
  delete-release-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release-cleanup branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -L \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/git/refs/heads/release-cleanup"
