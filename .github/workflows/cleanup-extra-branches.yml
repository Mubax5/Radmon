name: Cleanup Extra Branches
on:
  push:
    branches: [feature]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary branches
        run: |
          git push origin --delete feature-web-platform feature-temp-cleanup feature-temp-cleanup2 feature-temp-cleanup3 feature-temp-cleanup4 feature-temp-cleanup5 feature-temp-cleanup6 || true
