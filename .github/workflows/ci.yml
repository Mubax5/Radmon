name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev libegl1 libgl1
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyyaml
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Compile Python
        run: python -m compileall -q radmon packaging
      - name: Validate Grafana TV payloads
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from radmon.grafana_tv import (
              OPERATIONS_PAGE_UIDS,
              PAGE_UIDS,
              build_dashboard_payloads,
              build_playlist_payload,
              operation_page_stations,
          )
          dashboards = build_dashboard_payloads()
          assert len(PAGE_UIDS) == 3
          assert len(OPERATIONS_PAGE_UIDS) == 5
          assert len(dashboards) == 7
          assert [len(operation_page_stations(page)) for page in range(1, 6)] == [3, 3, 3, 3, 3]
          for dashboard in dashboards:
              json.dumps(dashboard, ensure_ascii=False)
              assert dashboard['refresh'] == '2s'
              assert max(panel['gridPos']['y'] + panel['gridPos']['h'] for panel in dashboard['panels']) <= 24
          playlist = build_playlist_payload()
          assert playlist['spec']['interval'] == '10s'
          assert len(playlist['spec']['items']) == 15
          for path in Path('grafana').rglob('*.yaml'):
              yaml.safe_load(path.read_text())
          for path in Path('grafana').rglob('*.yml'):
              yaml.safe_load(path.read_text())
          print('Grafana TV payloads valid')
          PY
