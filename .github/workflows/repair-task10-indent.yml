name: One-shot Task 10 Indent Repair

on:
  push:
    branches: [release-cleanup]
    paths:
      - scripts/repair_task10_indent.py
      - .github/workflows/repair-task10-indent.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore refresh_current_page to MainWindow
        run: python scripts/repair_task10_indent.py
      - name: Verify ownership and cleanup
        shell: bash
        run: |
          python -m compileall -q radmon
          grep -q '^    def refresh_current_page' radmon/admin/main_window.py
          ! grep -q '^def refresh_current_page' radmon/admin/main_window.py
          test ! -e scripts/repair_task10_indent.py
          test ! -e .github/workflows/repair-task10-indent.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "RadMon Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: restore refresh method ownership"
          git push origin HEAD:release-cleanup
