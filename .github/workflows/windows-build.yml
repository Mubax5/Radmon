name: Windows RadMon EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature
      - "feat/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt
          choco install innosetup mariadb grafana --no-progress -y

      - name: Build Kumo web frontend
        shell: pwsh
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
          if (-not (Test-Path "dist\index.html")) {
            throw "Vite did not create web\dist\index.html"
          }

      - name: Build RadMon.exe
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm RadMon.spec
          if (-not (Test-Path "dist\RadMon\RadMon.exe")) {
            throw "PyInstaller did not create dist\RadMon\RadMon.exe"
          }
          if (-not (Test-Path "dist\RadMon\web\index.html")) {
            throw "PyInstaller did not bundle the RadMon web frontend"
          }

      - name: Assemble portable RadMon layout
        shell: pwsh
        run: |
          $portable = "portable\RadMon"
          New-Item -ItemType Directory -Force "$portable\app" | Out-Null
          New-Item -ItemType Directory -Force "$portable\config" | Out-Null
          New-Item -ItemType Directory -Force "$portable\app\docs" | Out-Null
          Copy-Item "dist\RadMon\*" "$portable\app" -Recurse -Force
          Copy-Item "docs\manual" "$portable\app\docs\manual" -Recurse -Force
          Copy-Item "grafana" "$portable\app\grafana" -Recurse -Force
          Copy-Item ".env.example" "$portable\config\.env.example" -Force
          Copy-Item "README.md" "$portable\README.md" -Force
          @{
            commit_sha = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY
            release_tag = "latest"
            built_at_utc = [DateTime]::UtcNow.ToString("o")
          } | ConvertTo-Json | Set-Content "$portable\app\release.json" -Encoding utf8

      - name: Smoke test updater helper
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList @(
            "-NoProfile",
            "-NonInteractive",
            "-ExecutionPolicy", "Bypass",
            "-File", "packaging\radmon_update.ps1",
            "-InstallRoot", "$PWD",
            "-SelfTest"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "RadMon updater self-test failed with exit code $($process.ExitCode)"
          }

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "portable\RadMon\app\RadMon.exe" -ArgumentList "--server", "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "RadMon.exe smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Write executable checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "portable\RadMon\app\RadMon.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  app\RadMon.exe" | Set-Content "portable\RadMon\SHA256SUMS.txt" -Encoding ascii

      - name: Build RadMon installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "packaging\RadMon.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "installer\RadMon-Setup.exe")) {
            throw "Inno Setup did not create installer\RadMon-Setup.exe"
          }

      - name: Start native installer control-plane smoke dependencies
        shell: pwsh
        run: |
          $mariadbInstall = Get-ItemProperty -Path @(
            "HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*"
          ) -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MariaDB *" } |
            Select-Object -First 1
          $mariadbPath = if ($null -eq $mariadbInstall) { "" } else { Join-Path $mariadbInstall.InstallLocation "bin\mariadb.exe" }
          if (-not (Test-Path $mariadbPath)) {
            throw "Chocolatey did not install mariadb.exe"
          }
          $chocolateyRoot = [Environment]::GetEnvironmentVariable("ChocolateyInstall", "Machine")
          if (-not $chocolateyRoot) {
            $chocolateyRoot = Join-Path $env:ProgramData "chocolatey"
          }
          $grafana = Get-ChildItem (Join-Path $chocolateyRoot "lib\grafana\tools") -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("grafana-server.exe", "grafana.exe") } |
            Select-Object -First 1
          if ($null -eq $grafana) {
            throw "Chocolatey did not install a Grafana executable"
          }

          $databaseDeadline = [DateTime]::UtcNow.AddMinutes(2)
          do {
            & $mariadbPath --protocol=tcp -h 127.0.0.1 -uroot -e "SELECT 1" *> $null
            if ($LASTEXITCODE -eq 0) {
              break
            }
            Start-Sleep -Seconds 1
          } while ([DateTime]::UtcNow -lt $databaseDeadline)
          if ($LASTEXITCODE -ne 0) {
            throw "Native installer smoke MariaDB did not become ready"
          }

          & $mariadbPath --protocol=tcp -h 127.0.0.1 -uroot -e "CREATE DATABASE IF NOT EXISTS ipradmon"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create the native installer smoke MariaDB database"
          }

          $schema = @'
          CREATE TABLE device (
            serid INT PRIMARY KEY, name VARCHAR(255), location VARCHAR(255),
            maxidlemin INT, warnlevel DOUBLE, alarmlevel DOUBLE, unit VARCHAR(32),
            audiopath TEXT, hwaddress VARCHAR(255), hwtype VARCHAR(255), description TEXT
          );
          CREATE TABLE measurement (
            serid INT, dtom DATETIME, doserate DOUBLE, dose DOUBLE, previnterval INT, stat INT,
            PRIMARY KEY (serid, dtom)
          );
          CREATE TABLE alarm (
            serid INT, dtoa DATETIME, lvl VARCHAR(32), mvalue DOUBLE, thvalue DOUBLE,
            nhit INT, ack INT, pic VARCHAR(255), note TEXT, i_op INT, i_flag INT
          );
          CREATE TABLE applog (ts DATETIME, id INT, msg TEXT);
          CREATE TABLE news (ts DATETIME, code INT, content TEXT);
          CREATE TABLE rawdata (serid INT, dtom DATETIME, val TEXT);
          '@
          $schema | & $mariadbPath --protocol=tcp -h 127.0.0.1 -uroot ipradmon
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize the native installer smoke MariaDB schema"
          }
          $grafana.FullName | Set-Content (Join-Path $env:RUNNER_TEMP "radmon-ci-grafana-path.txt") -Encoding ascii

      - name: Smoke test installed RadMon
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "RadMon-Install-Test"
          if (Test-Path $installRoot) {
            Remove-Item $installRoot -Recurse -Force
          }
          $grafanaExe = (Get-Content (Join-Path $env:RUNNER_TEMP "radmon-ci-grafana-path.txt") -Raw).Trim()
          $configDir = Join-Path $installRoot "config"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          @(
            "RADMON_DB_HOST=127.0.0.1"
            "RADMON_DB_PORT=3306"
            "RADMON_DB_USER=root"
            "RADMON_DB_PASSWORD="
            "RADMON_DB_NAME=ipradmon"
            "RADMON_GRAFANA_PORT=3300"
            "RADMON_GRAFANA_BIN=$grafanaExe"
            "RADMON_LAN_SOURCES="
            "RADMON_ARCHIVE_ENABLED=0"
          ) | Set-Content (Join-Path $configDir ".env") -Encoding ascii
          $setup = Start-Process -FilePath "installer\RadMon-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "RadMon installer smoke test failed with exit code $($setup.ExitCode)"
          }
          $installedExe = Join-Path $installRoot "app\RadMon.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installer did not create $installedExe"
          }
          $marker = Get-Content (Join-Path $installRoot "app\release.json") -Raw | ConvertFrom-Json
          if ([string]$marker.commit_sha -ne $env:GITHUB_SHA) {
            throw "Installer release marker does not match GITHUB_SHA"
          }
          Get-ScheduledTask -TaskName "RadMon Updater" -ErrorAction Stop | Out-Null
          $app = Start-Process -FilePath $installedExe -ArgumentList "--server", "--smoke-test" -Wait -PassThru
          if ($app.ExitCode -ne 0) {
            throw "Installed RadMon.exe smoke test failed with exit code $($app.ExitCode)"
          }

      - name: Smoke test installer upgrade over running RadMon
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "RadMon-Install-Test"
          $installedExe = Join-Path $installRoot "app\RadMon.exe"
          $task = Get-ScheduledTask -TaskName "RadMon Server" -ErrorAction Stop
          if ($null -eq $task) {
            throw "RadMon Server scheduled task was not registered by the first install"
          }

          Start-ScheduledTask -TaskName "RadMon Server"
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          $serverProcess = $null
          do {
            Start-Sleep -Milliseconds 500
            $serverProcess = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ExecutablePath -and ([System.IO.Path]::GetFullPath([string]$_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($installedExe))
                }
            ) | Select-Object -First 1
          } while ($null -eq $serverProcess -and [DateTime]::UtcNow -lt $deadline)

          if ($null -eq $serverProcess) {
            throw "RadMon Server process did not start before upgrade smoke test"
          }

          $upgrade = Start-Process -FilePath "installer\RadMon-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            throw "RadMon installer upgrade smoke test failed with exit code $($upgrade.ExitCode)"
          }
          if (-not (Test-Path $installedExe)) {
            throw "RadMon installer upgrade removed $installedExe"
          }
          $taskAfterUpgrade = Get-ScheduledTask -TaskName "RadMon Server" -ErrorAction Stop
          if ($null -eq $taskAfterUpgrade) {
            throw "RadMon Server scheduled task was not restored after upgrade"
          }
          Get-ScheduledTask -TaskName "RadMon Updater" -ErrorAction Stop | Out-Null

           $readinessDeadline = [DateTime]::UtcNow.AddSeconds(45)
           $health = $null
           $lastHealthError = $null
           $healthReady = $false
           do {
             try {
               $response = Invoke-WebRequest -Uri "http://127.0.0.1:8090/health" -TimeoutSec 2 -UseBasicParsing
               $health = $response.Content | ConvertFrom-Json
               if ($response.StatusCode -eq 200 -and $health.status -eq "ok") {
                 $healthReady = $true
                 break
               }
              $lastHealthError = "HTTP $($response.StatusCode), health status '$($health.status)'"
            }
            catch {
              $lastHealthError = $_.Exception.Message
            }
            if ([DateTime]::UtcNow -lt $readinessDeadline) {
              Start-Sleep -Milliseconds 500
            }
          } while ([DateTime]::UtcNow -lt $readinessDeadline)

           if (-not $healthReady) {
            $taskInfo = Get-ScheduledTaskInfo -TaskName "RadMon Server" -ErrorAction SilentlyContinue
            $taskSummary = if ($null -eq $taskInfo) {
              "unavailable"
            } else {
              "state=$($taskAfterUpgrade.State); lastTaskResult=$($taskInfo.LastTaskResult); lastRunTime=$($taskInfo.LastRunTime)"
            }
            $processIds = @(
              Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ExecutablePath -and ([System.IO.Path]::GetFullPath([string]$_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($installedExe))
                } |
                ForEach-Object { $_.ProcessId }
            ) -join ", "
            $listeners = @(
              Get-NetTCPConnection -State Listen -LocalPort 8090 -ErrorAction SilentlyContinue |
                ForEach-Object { "pid=$($_.OwningProcess); local=$($_.LocalAddress):$($_.LocalPort)" }
            ) -join ", "
            throw "RadMon control plane did not become ready after upgrade within 45 seconds. Last health result: $lastHealthError. Task: $taskSummary. RadMon PIDs: $processIds. Port 8090 listeners: $listeners"
          }

      - name: Write installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "installer\RadMon-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  RadMon-Setup.exe" | Set-Content "installer\RadMon-Setup.exe.sha256" -Encoding ascii

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RadMon-Windows
          path: portable\RadMon
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadMon-Setup
          path: |
            installer\RadMon-Setup.exe
            installer\RadMon-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish current RadMon release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "latest"
          $title = "RadMon"
          $notes = "Current production Windows installer. It runs the RadMon web platform headlessly at Windows startup, serves the authenticated Kumo control plane, preserves editable Grafana monitoring data across restart and upgrade, and installs the verified automatic release updater. Existing config, runtime, archives, and reports are preserved."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # For an existing production release, publish and validate the new assets
          # while `latest` still points at the old commit. Moving the tag is the
          # final publication gate, so installed updaters cannot observe a new SHA
          # paired with stale assets during the clobber window.
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "installer\RadMon-Setup.exe" "installer\RadMon-Setup.exe.sha256" --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload RadMon release assets" }
            gh release edit $tag --title $title --latest --notes $notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to update RadMon release metadata" }
          }
          else {
            # Bootstrap path only: if no release exists yet, create it for this SHA.
            gh release create $tag "installer\RadMon-Setup.exe" "installer\RadMon-Setup.exe.sha256" --target $env:GITHUB_SHA --title $title --latest --notes $notes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to create RadMon release" }
          }

          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force
