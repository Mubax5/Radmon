name: One-shot Task 7 Finalize

on:
  push:
    branches: [release-cleanup]
    paths:
      - .github/workflows/task7-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fix closure calls and explicit LAN authorization test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lan = Path('radmon/lan.py')
          text = lan.read_text(encoding='utf-8')
          old_live = 'live_result = run_live_once(self, source)'
          old_backfill = 'backfill_result = run_backfill_once(self, source, 0)'
          if old_live not in text or old_backfill not in text:
              raise SystemExit('expected run_source_once closure calls not found')
          text = text.replace(old_live, 'live_result = self.run_live_once(source)', 1)
          text = text.replace(old_backfill, 'backfill_result = self.run_backfill_once(source, 0)', 1)
          lan.write_text(text, encoding='utf-8')

          test = Path('tests/test_production_safety_guards.py')
          source = test.read_text(encoding='utf-8')
          marker = 'settings = replace(Settings(), runtime_dir=tmp_path)'
          if source.count(marker) < 2:
              raise SystemExit('expected two legacy Settings constructions')
          source = source.replace(
              marker,
              'settings = replace(Settings(), runtime_dir=tmp_path, lan_enabled=False)',
              1,
          )
          source = source.replace(
              marker,
              'settings = replace(Settings(), runtime_dir=tmp_path, lan_enabled=True)',
              1,
          )
          test.write_text(source, encoding='utf-8')

          Path('.github/workflows/task7-finalize.yml').unlink()
          PY
          python -m compileall -q radmon
      - name: Commit final Task 7 corrections
        shell: bash
        run: |
          git config user.name "RadMon Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize LAN safety consolidation"
          git push origin HEAD:release-cleanup
