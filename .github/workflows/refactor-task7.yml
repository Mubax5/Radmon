name: One-shot Task 7 Refactor

on:
  push:
    branches: [release-cleanup]
    paths:
      - .github/workflows/refactor-task7.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic consolidation
        run: python scripts/refactor_task7.py
      - name: Commit consolidated sources
        shell: bash
        run: |
          git config user.name "RadMon Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: consolidate LAN and alarm safety patches"
          git push origin HEAD:release-cleanup
