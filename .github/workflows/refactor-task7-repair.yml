name: One-shot Task 7 Repair

on:
  push:
    branches: [release-cleanup]
    paths:
      - .github/workflows/refactor-task7-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pre-refactor sources and apply stable consolidation
        shell: bash
        run: |
          git revert --no-commit a5b649ad099ebb833e6bac8508b62560fe8f2c0a
          python scripts/refactor_task7_fixed.py
      - name: Verify class structure before commit
        shell: bash
        run: |
          python -m compileall -q radmon
          python - <<'PY'
          import ast
          from pathlib import Path

          def methods(path, class_name):
              tree = ast.parse(Path(path).read_text(encoding='utf-8'))
              cls = next(node for node in tree.body if isinstance(node, ast.ClassDef) and node.name == class_name)
              return {node.name for node in cls.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}

          assert {'live_rows', 'alarms_after', 'active_alarm_keys'} <= methods('radmon/lan.py', 'RemoteMariaDBSource')
          assert {'_ensure_alarm_checkpoint_table', 'load_alarm', 'save_alarm'} <= methods('radmon/lan.py', 'LanCheckpointStore')
          assert {'_upsert_live_rows_base', 'upsert_live_rows', 'mark_alarm_handled'} <= methods('radmon/lan.py', 'MariaCentralStore')
          assert {'_run_live_core_once', 'run_live_once', 'run_backfill_once', 'run_source_once'} <= methods('radmon/lan.py', 'LanAggregator')
          assert {'_ensure_active_schema', 'mirror', '_row', 'list_alarms', 'get', 'mark_acknowledged', 'reconcile_source_active_keys'} <= methods('radmon/remote_alarm.py', 'RemoteAlarmMirror')
          for name in ('lan_revision.py', 'remote_alarm_revision.py', 'production_safety_revision.py'):
              assert not (Path('radmon') / name).exists()
          print('Task 7 structure OK')
          PY
      - name: Commit repaired consolidation
        shell: bash
        run: |
          git config user.name "RadMon Refactor Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: repair LAN and alarm safety consolidation"
          git push origin HEAD:release-cleanup
